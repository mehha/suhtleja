name: Deploy to Cloudflare

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  # Deploy runs D1 migrations; never cancel a run halfway through them.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # The runner cache can lag behind Payload's minimum Node 24 patch release.
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Checks run before the database migrations, so a failing check never leaves production
      # migrated without the app that goes with it. The integration tests include a guard that
      # rejects migrations which rebuild a table (that cascade-deletes child rows on D1).
      - name: Type-check
        run: pnpm exec tsc --noEmit

      # The Payload-backed tests use a throwaway local D1 on the runner (no Cloudflare credentials in
      # this step), so migrate it first. The secret only has to exist; it never touches production.
      # Remove the local state afterwards: the build starts several workers that would all open it
      # and fail with "database is locked".
      - name: Integration tests
        env:
          PAYLOAD_SECRET: ci-test-secret
        run: |
          pnpm payload migrate
          pnpm test:int
          rm -rf .wrangler/state

      - name: Check R2 cache upload configuration
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for name in CF_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for R2 cache upload. Configure the repository's Actions secrets and variables."
              missing=1
            fi
          done
          exit "$missing"

      - name: Migrate database and deploy app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          SPEECH_KEY: ${{ secrets.SPEECH_KEY }}
          SPEECH_REGION: ${{ vars.SPEECH_REGION }}
          SPEECH_VOICE: ${{ vars.SPEECH_VOICE }}
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
          NEXT_PUBLIC_MEDIA_BASE_URL: ${{ vars.NEXT_PUBLIC_MEDIA_BASE_URL }}
          DEFAULT_PARENT_PIN: ${{ secrets.DEFAULT_PARENT_PIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_MEMBERSHIP: ${{ secrets.STRIPE_PRICE_ID_MEMBERSHIP }}
          STRIPE_KEYRING: ${{ secrets.STRIPE_KEYRING }}
          STRIPE_BILLING_PORTAL_CONFIGURATION_ID: ${{ vars.STRIPE_BILLING_PORTAL_CONFIGURATION_ID }}
        run: pnpm run deploy

      # Read-only smoke tests against the site that was just deployed: every public page has one h1,
      # images load, /demo redirects, the homepage speech works. A failure here means production
      # is live but broken, so look at it right away.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test the deployed site
        env:
          SMOKE_BASE_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
        run: pnpm test:e2e
